services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: gray
      POSTGRES_USER: gray
      POSTGRES_PASSWORD: guest
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gray -d gray"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: psql://gray:guest@db:5432/gray
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./media:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
